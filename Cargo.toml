[workspace]
resolver = "2"
members = ["crates/codesprout-core", "crates/codesprout-app", "crates/codesprout-wsl"]

[workspace.package]
version = "2.1.1"
edition = "2021"
authors = ["Alonso García"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
