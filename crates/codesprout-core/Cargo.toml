[package]
name = "codesprout-core"
description = "Motor Git de CodeSprout: operaciones, parsers, credenciales y disposición del explorador de ramas"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }
trash = "5"
similar = "2"
sha2 = "0.10"
codesprout-wsl = { path = "../codesprout-wsl" }

[dev-dependencies]
tempfile = "3"
