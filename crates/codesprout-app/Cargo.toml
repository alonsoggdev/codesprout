[package]
name = "codesprout-app"
description = "CodeSprout: cliente Git de escritorio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "codesprout"
path = "src/main.rs"

[dependencies]
codesprout-core = { path = "../codesprout-core" }
codesprout-wsl = { path = "../codesprout-wsl" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = "0.31"
rfd = { version = "0.15", default-features = false }
notify = "8"
dirs = "6"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }

# GTK file dialogs on Linux: the default xdg-portal backend needs a desktop portal, which WSL lacks.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[build-dependencies]
winresource = "0.1"
