# Publishes a GitHub release when a version tag is pushed: `git tag v2.1.0 && git push origin v2.1.0`.
# The app's updater looks for `codesprout-windows-x64.exe` and its `.sha256` in the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi

      - name: Test
        run: cargo test -p codesprout-core

      - name: Build
        run: cargo build -p codesprout-app --release

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp target/release/codesprout.exe dist/codesprout-windows-x64.exe
          (cd dist && sha256sum codesprout-windows-x64.exe > codesprout-windows-x64.exe.sha256)

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" installer\codesprout.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: softprops/action-gh-release@v2
        with:
          name: CodeSprout ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
