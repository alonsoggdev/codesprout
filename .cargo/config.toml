# Link the C runtime statically so the .exe runs on PCs without the Visual C++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The WSL agent is a static Linux binary; rust-lld links it from Windows without a C toolchain:
#   cargo build -p codesprout-wsl --release --target x86_64-unknown-linux-musl
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
